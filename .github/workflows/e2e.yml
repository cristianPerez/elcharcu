# ============================================================================
# Antes de mezclar a `main`: tipos, lint y los e2e de Playwright (2026-10-03)
#
# Corre en cada PR hacia `main`. La protección de la rama exige los dos jobs
# en verde para poder mezclar, así que los e2e ya no hay que correrlos a mano.
#
# Los e2e van contra la base de QA con la IA SIMULADA (`AI_SIMULAR_IA`): no
# gastan Gemini, pero sí usan tres cuentas de prueba de QA. Las claves llegan
# de los secretos del repo (Settings → Secrets → Actions):
#
#   QA_SUPABASE_URL               la URL del proyecto de QA
#   QA_SUPABASE_PUBLISHABLE_KEY   su clave pública
#   QA_SUPABASE_SECRET_KEY        su clave de servicio (crea las cuentas de prueba)
#
# ⚠️ El repo es PÚBLICO: GitHub no entrega los secretos a PRs que vengan de un
# fork, y ahí los e2e fallan a propósito. Los PR de la casa salen de ramas del
# propio repo (develop → main) y sí los reciben.
# ============================================================================
name: Antes de mezclar

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una sola corrida de e2e a la vez: los tests comparten cuentas de prueba en
# QA, y dos corridas en paralelo se pisarían el progreso.
concurrency:
  group: e2e-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (tipos, lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      # Que el build de producción compila. Sin claves de Supabase: las páginas
      # estáticas de recetas se generan igual (sin cursos enlazados).
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.QA_SUPABASE_SECRET_KEY }}
      # Sin presupuesto el asistente se corta (0 = cerrado). Con la IA simulada
      # no se gasta nada, pero el tope se comprueba igual.
      AI_DAILY_BUDGET_LEADS_USD: '5'
      AI_DAILY_BUDGET_PRO_USD: '10'
      AI_SIMULAR_IA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Comprobar que están los secretos de QA
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto de QA para $name (Settings → Secrets → Actions)."
              exit 1
            fi
          done

      - name: Navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E en móvil (390×844) y escritorio (1440×900)
        run: pnpm test:e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
