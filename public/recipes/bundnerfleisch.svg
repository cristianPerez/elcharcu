  <rect width="600" height="450" filter="url(#grain)" opacity="0.05"/>
  <rect x="16" y="16" width="568" height="418" rx="18" fill="none" stroke="#F4F1EB" stroke-opacity="0.16"/>
  <g transform="translate(40 388)">
